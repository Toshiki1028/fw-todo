<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>やること一覧</title>
    <script src="/theme.js?v=wallpaper-1"></script>
    <link rel="stylesheet" href="/css/style.css?v=wallpaper-1">
</head>

<body>
    <div class="container todo-list-page">
        <div class="page-heading">
            <h1 class="page-title" th:text="${trash == 1 ? '削除済みのやること' : 'やること一覧'}">やること一覧</h1>
            <nav class="page-switch" aria-label="表示画面の切り替え">
                <button type="button" data-wallpaper-open>壁紙</button>
                <a th:href="@{/todos}" aria-current="page"><span aria-hidden="true">≡</span> 一覧</a>
                <a th:href="@{/calendar}"><span aria-hidden="true">▦</span> カレンダー</a>
            </nav>
        </div>

        <div class="todo-actions">
            <a class="btn" th:href="@{/todos/new}">＋ 新規登録</a>
            <a class="btn sub"
                th:href="@{/api/todos.csv(keyword=${keyword}, category=${category}, order=${order}, showCompleted=${showCompleted}, trash=${trash})}">CSV出力</a>
            <a class="btn sub" th:if="${trash == 0}" th:href="@{/todos(trash=1)}">削除済み</a>
            <a class="btn sub" th:if="${trash == 1}" th:href="@{/todos}">一覧に戻る</a>
        </div>
        <div class="todo-filter-row">
            <button type="submit" class="btn bulk-delete-button" form="bulk-delete-form" th:if="${trash == 0}" disabled>
                削除
            </button>
            <form id="todo-filter-form" class="search-bar" method="get" th:action="@{/todos}">
                <input class="form-input search-keyword" type="text" name="keyword" th:value="${keyword}"
                    placeholder="やることを検索" aria-label="やることを検索">

                <input type="hidden" name="trash" value="1" th:if="${trash == 1}">
                <input type="hidden" name="category" th:value="${category}">
                <input type="hidden" name="order" th:value="${order}">

                <button class="btn" type="submit">絞り込む</button>
            </form>
        </div>
        <p th:if="${#lists.isEmpty(todos)}" th:text="${trash == 1 ? '削除済みのやることはありません' : '表示できるやることはありません'}">
            表示できるやることはありません</p>
        <form id="bulk-delete-form" th:action="@{/todos/delete-selected}" method="post" th:if="${trash == 0}">
        </form>

        <div class="todo-table-area" th:if="${trash == 0 or !#lists.isEmpty(todos)}">

            <!-- 表の見出しの真上に配置する操作項目 -->
            <div class="todo-table-toolbar">

                <div class="todo-toolbar-empty"></div>
                <div class="todo-toolbar-empty"></div>
                <div class="todo-toolbar-empty"></div>

                <!-- 期限列の真上 -->
                <div class="todo-toolbar-sort">
                    <a class="link"
                        th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', hideCompleted=${hideCompleted}, page=${currentPage}, trash=${trash})}">
                        昇順
                    </a>
                    <a class="link"
                        th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', hideCompleted=${hideCompleted}, page=${currentPage}, trash=${trash})}">
                        降順
                    </a>
                    <a class="link"
                        th:href="@{/todos(keyword=${keyword}, category=${category}, order='manual', hideCompleted=${hideCompleted}, page=${currentPage}, trash=${trash})}">
                        標準順
                    </a>
                </div>

                <!-- 状態列の真上 -->
                <label class="todo-toolbar-completed" th:if="${trash == 0}">
                    <input type="checkbox" name="hideCompleted" value="true" th:checked="${hideCompleted}"
                        form="todo-filter-form" onchange="this.form.requestSubmit()">
                    完了を非表示
                </label>
                <div class="todo-toolbar-empty" th:if="${trash == 1}"></div>


                <div class="todo-toolbar-empty" th:if="${trash == 1}"></div>

                <!-- 選択したTodoを削除確認画面へ送る -->


                <div class="todo-toolbar-notification">
                    <div class="toast-notice" th:if="${flashMessage != null or message != null}" role="status"
                        aria-live="polite">
                        <div class="toast-notice-content">
                            <div class="toast-notice-heading">
                                <span aria-hidden="true">●</span> 通知
                            </div>
                            <span class="toast-notice-message"
                                th:text="${flashMessage != null ? flashMessage : message}"></span>
                        </div>
                        <button type="button" class="toast-notice-close" aria-label="通知を閉じる">×</button>
                    </div>
                </div>

            </div>

            <div class="todo-table-scroll" th:unless="${#lists.isEmpty(todos)}">
                <table class="todo-table">
                    <thead>
                        <tr>
                            <th class="todo-select-column">
                                <input type="checkbox" id="select-all-todos" aria-label="すべて選択">
                            </th>
                            <th>やること</th>
                            <th>ジャンル</th>
                            <th>優先度</th>
                            <th>期限</th>
                            <th>状態</th>
                            <th>操作</th>
                            <th aria-label="並び替え"></th>
                        </tr>
                    </thead>
                    <tbody>

                        <tr th:each="todo : ${todos}" th:attr="data-todo-id=${todo.id},data-pinned=${todo.pinned}"
                            th:classappend="${trash == 0 and todo.dueDate != null and todo.dueDate.isBefore(today) and todo.completed != true} ? 'todo-overdue' : ''">

                            <td class="todo-select-column">
                                <input type="checkbox" class="todo-select-checkbox" name="selectedIds"
                                    th:value="${todo.id}" form="bulk-delete-form" aria-label="削除対象として選択">
                            </td>

                            <td th:title="${todo.title}">
                                <span th:text="${todo.title}">やること</span>
                            </td>

                            <td th:text="${todo.category}" th:title="${todo.category}">ジャンル</td>

                            <td>
                                <span th:if="${todo.priority == 1}" class="priority-high-marker"
                                    aria-hidden="true">★</span>
                                <span
                                    th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : (todo.priority == 3 ? '低' : ''))}">優先度</span>
                            </td>

                            <td th:text="${todo.dueDate}">期限</td>

                            <td class="todo-status-cell">
                                <span th:text="${trash == 1 ? '削除済み' : (todo.completed ? '完了' : '未完了')}" th:title="${trash == 1 and todo.deletedAt != null
              ? '削除日時：' + #temporals.format(todo.deletedAt, 'yyyy-MM-dd HH:mm')
              : (trash == 0 and todo.completed == true and todo.completedAt != null
                  ? '完了日時：' + #temporals.format(todo.completedAt, 'yyyy-MM-dd HH:mm')
                  : null)}">状態</span>
                            </td>

                            <td th:if="${trash == 0}">

                                <div class="todo-operation">

                                    <form th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post">
                                        <input type="hidden" name="keyword" th:value="${keyword}">
                                        <input type="hidden" name="category" th:value="${category}">
                                        <input type="hidden" name="order" th:value="${order}">
                                        <input type="hidden" name="hideCompleted" th:value="${hideCompleted}">
                                        <input type="hidden" name="page" th:value="${currentPage}">

                                        <button class="todo-icon-action todo-pin-action"
                                            th:classappend="${todo.pinned} ? ' is-pinned' : ''" type="submit"
                                            th:title="${todo.pinned ? '印を外す' : '印を付ける'}"
                                            th:aria-label="${todo.pinned ? '印を外す' : '印を付ける'}">
                                            <span aria-hidden="true">📌</span>
                                        </button>
                                    </form>

                                    <div class="todo-operation-links">
                                        <a class="todo-icon-action todo-edit-action"
                                            th:href="@{/todos/{id}/edit(id=${todo.id})}" title="編集" aria-label="編集">
                                            <span aria-hidden="true">✎</span>
                                        </a>


                                    </div>

                                </div>

                            </td>
                            <td th:if="${trash == 1}">
                                <form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post">
                                    <button class="btn" type="submit">戻す</button>
                                </form>
                            </td>
                            <td class="todo-reorder-cell">
                                <span class="todo-drag-handle" th:classappend="${trash == 1} ? ' is-disabled' : ''"
                                    th:attr="aria-label=${trash == 0 ? 'ドラッグして並び替え' : '削除済みのため並び替えできません'}"
                                    title="ドラッグして並び替え">⋮⋮</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <nav class="pagination" th:if="${totalPages > 1}" aria-label="ページの移動">
            <a class="link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, hideCompleted=${hideCompleted}, page=${pageNumber}, trash=${trash})}"
                th:attr="aria-current=${pageNumber == currentPage ? 'page' : null}" th:text="${pageNumber}">1</a>
        </nav>
    </div>

    <script>
        document.querySelectorAll('.toast-notice').forEach(notice => {
            const closeButton = notice.querySelector('.toast-notice-close');

            function closeNotice() {
                notice.remove();
            }

            // ×を押すと通知を消す
            closeButton.addEventListener('click', closeNotice);

            // 4秒後に自動で消す
            setTimeout(closeNotice, 4000);
        });
    </script>
    <script th:if="${trash == 0}" th:src="@{/todo-reorder.js?v=1}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selectAll = document.getElementById('select-all-todos');
            const checkboxes = document.querySelectorAll('.todo-select-checkbox');
            const deleteButton = document.querySelector('.bulk-delete-button');

            if (!selectAll || !deleteButton) return;

            function updateSelection() {
                const checkedCount = Array.from(checkboxes)
                    .filter(checkbox => checkbox.checked && !checkbox.disabled)
                    .length;

                deleteButton.disabled = checkedCount === 0;

                const available = Array.from(checkboxes)
                    .filter(checkbox => !checkbox.disabled);

                selectAll.checked = available.length > 0
                    && checkedCount === available.length;

                selectAll.indeterminate = checkedCount > 0
                    && checkedCount < available.length;
            }

            selectAll.addEventListener('change', () => {
                checkboxes.forEach(checkbox => {
                    if (!checkbox.disabled) {
                        checkbox.checked = selectAll.checked;
                    }
                });

                updateSelection();
            });

            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', updateSelection);
            });

            updateSelection();
        });
    </script>

</body>

</html>
