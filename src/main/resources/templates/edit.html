<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>やることを編集</title>
    <script src="/theme.js?v=theme-3"></script>
    <script src="/category-picker.js?v=1" defer></script>
    <link rel="stylesheet" href="/css/style.css?v=category-2">
</head>

<body>
    <div class="container todo-form-page">
        <h1 class="page-title">やることを編集</h1>

        <form th:action="@{/todos/{id}/confirm(id=${id})}" th:object="${todo}" method="post">

            <div class="form-row">
                <label class="form-label" for="title">やること</label>
                <input class="form-input" type="text" id="title" th:field="*{title}">
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <div class="form-row">
                <label class="form-label" for="detail">メモ</label>
                <input class="form-input" type="text" id="detail" th:field="*{detail}">
                <p class="error" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></p>
            </div>

            <div class="form-two-columns">
                <div class="form-row">
                    <label class="form-label" for="category-trigger">ジャンル</label>
                    <div class="category-picker" data-category-picker>
                        <input type="hidden" id="category" th:field="*{category}">
                        <button class="form-input category-trigger" id="category-trigger" type="button"
                            aria-expanded="false" aria-controls="category-menu">
                            <span data-category-label th:text="${#strings.isEmpty(todo.category) ? '選択してください' : todo.category}">選択してください</span>
                            <span aria-hidden="true">▾</span>
                        </button>
                        <div class="category-menu" id="category-menu" hidden>
                            <button class="category-add" type="button" data-category-add>＋ 新しいジャンルを追加</button>
                            <div data-category-list>
                                <div class="category-option" th:each="item : ${categories}"
                                    th:attr="data-category-id=${item.id},data-category-name=${item.name}">
                                    <button type="button" data-category-select th:text="${item.name}">ジャンル</button>
                                    <button type="button" data-category-edit th:attr="aria-label=|${item.name}の名前を変更|">✎</button>
                                    <button type="button" data-category-delete th:attr="aria-label=|${item.name}を削除|">×</button>
                                </div>
                            </div>
                            <p class="error category-message" data-category-message role="alert" hidden></p>
                        </div>
                    </div>
                    <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
                </div>

                <div class="form-row">
                    <label class="form-label" for="priority">優先度</label>
                    <select class="form-input" id="priority" th:field="*{priority}">
                        <option value="">選択してください</option>
                        <option value="1">高</option>
                        <option value="2">中</option>
                        <option value="3">低</option>
                    </select>
                    <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></p>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="dueDate">期限</label>
                <input class="form-input" type="date" id="dueDate" th:field="*{dueDate}">
            </div>

            <div class="form-row">
                <label for="completed">
                    <input type="checkbox" id="completed" th:field="*{completed}">
                    完了
                </label>
            </div>

            <button class="btn" type="submit">確認する</button>
            <a class="btn sub" th:href="@{/todos}">一覧へ</a>
        </form>
    </div>
</body>

</html>
